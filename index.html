<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDoc Compressor & Uploader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library PDF.js & jsPDF untuk memproses PDF di Browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Supabase SDK (Opsional jika ingin langsung ke Supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 font-sans text-slate-800">

  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-200">
    <!-- Header -->
    <div class="bg-indigo-600 p-6 text-white">
      <h1 class="text-2xl font-bold">Pengumpulan & Kompresi Dokumen Otomatis</h1>
      <p class="text-indigo-100 text-sm mt-1">Deteksi otomatis Gambar & PDF dengan penyesuaian target ukuran file tanpa mengubah isi.</p>
    </div>

    <form id="uploadForm" class="p-6 space-y-5">
      <!-- Data Pengirim -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1">Nama Lengkap *</label>
          <input type="text" id="nama" required placeholder="Masukkan nama..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Kategori / Keterangan *</label>
          <input type="text" id="keterangan" required placeholder="Misal: Berkas Pendaftaran" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>

      <!-- Dropzone File -->
      <div>
        <label class="block text-sm font-semibold mb-1">Pilih File (Gambar JPG/PNG atau PDF) *</label>
        <div class="border-2 border-dashed border-indigo-300 rounded-xl p-6 text-center bg-indigo-50/40 hover:bg-indigo-50 transition cursor-pointer" onclick="document.getElementById('fileInput').click()">
          <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,application/pdf" class="hidden" required>
          <p class="text-indigo-600 font-medium" id="dropText">Klik untuk memilih file Gambar atau PDF</p>
          <p class="text-xs text-slate-500 mt-1">Sistem akan otomatis mendeteksi jenis file Anda</p>
        </div>
      </div>

      <!-- Panel Deteksi & Pilihan Rentang Ukuran (Muncul Otomatis) -->
      <div id="compressionPanel" class="hidden bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
        <div class="flex items-center justify-between border-b border-slate-200 pb-3">
          <div>
            <span id="fileTypeBadge" class="px-2.5 py-1 text-xs font-bold uppercase rounded-full bg-indigo-100 text-indigo-700">Mendeteksi...</span>
            <p id="fileNameDisplay" class="text-sm font-medium text-slate-700 mt-1 truncate max-w-xs"></p>
          </div>
          <div class="text-right">
            <span class="text-xs text-slate-500 block">Ukuran Asli</span>
            <span id="originalSizeDisplay" class="text-base font-bold text-slate-800">0 KB</span>
          </div>
        </div>

        <!-- Pilihan Rentang Ukuran Target -->
        <div>
          <label class="block text-sm font-semibold mb-2">Pilih Target Ukuran File Hasil Kompresi:</label>
          <div id="sizeOptionsContainer" class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
            <!-- Opsi di-generate otomatis oleh JS sesuai jenis file -->
          </div>
        </div>

        <!-- Tombol Uji Kompresi & Hasil -->
        <div class="flex items-center justify-between pt-2">
          <button type="button" id="btnCompress" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold rounded-lg transition">
            Proses Kompresi Sekarang
          </button>
          <div id="compressedResultBox" class="hidden text-right">
            <span class="text-xs text-emerald-600 font-semibold block">Ukuran Setelah Kompresi:</span>
            <span id="compressedSizeDisplay" class="text-lg font-extrabold text-emerald-600">0 KB</span>
          </div>
        </div>

        <!-- Progress Bar untuk PDF -->
        <div id="progressContainer" class="hidden">
          <div class="w-full bg-slate-200 rounded-full h-2">
            <div id="progressBar" class="bg-indigo-600 h-2 rounded-full transition-all" style="width: 0%"></div>
          </div>
          <p id="progressText" class="text-xs text-slate-500 mt-1 text-center"></p>
        </div>
      </div>

      <!-- Tombol Submit Utama -->
      <button type="submit" id="btnSubmit" disabled class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow transition">
        Kirim Dokumen Terkompresi
      </button>

      <div id="statusAlert" class="hidden p-4 rounded-xl text-sm font-medium"></div>
    </form>
  </div>

<script>
  // ==========================================
  // KONFIGURASI BACKEND (ISI SESUAI KEBUTUHAN)
  // ==========================================
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxES-PNGaytk74AvtqVw1U8iQ--NS2V_Q44C48VUNrOczjXZm98orD-xx-sIP5R0sOl/exec"; 
  
  // Opsional: Jika ingin langsung simpan metadata ke Supabase dari Frontend
  const USE_DIRECT_SUPABASE = false; 
  const SUPABASE_URL = "https://xxxx.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6...";

  // Konfigurasi Worker PDF.js
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let currentFile = null;
  let compressedBlob = null;
  let detectedType = ""; // "image" atau "pdf"

  const fileInput = document.getElementById('fileInput');
  const compressionPanel = document.getElementById('compressionPanel');
  const sizeOptionsContainer = document.getElementById('sizeOptionsContainer');
  const btnCompress = document.getElementById('btnCompress');
  const btnSubmit = document.getElementById('btnSubmit');

  // Format angka Byte ke KB / MB
  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";
    else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
    else return (bytes / 1048576).toFixed(2) + " MB";
  }

  // 1. DETEKSI OTOMATIS SAAT FILE DIPILIH
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    currentFile = file;
    compressedBlob = null;
    btnSubmit.disabled = true;
    document.getElementById('compressedResultBox').classList.add('hidden');
    compressionPanel.classList.remove('hidden');

    document.getElementById('fileNameDisplay').textContent = file.name;
    document.getElementById('originalSizeDisplay').textContent = formatBytes(file.size);

    // Deteksi MIME Type
    if (file.type.startsWith('image/')) {
      detectedType = 'image';
      document.getElementById('fileTypeBadge').textContent = 'File Gambar Terdeteksi';
      document.getElementById('fileTypeBadge').className = 'px-2.5 py-1 text-xs font-bold uppercase rounded-full bg-blue-100 text-blue-700';
      renderSizeOptions([
        { label: 'Ekstra Kecil (< 150 KB)', targetKB: 140, desc: 'Kompresi tinggi' },
        { label: 'Sedang (150 - 350 KB)', targetKB: 300, desc: 'Rekomendasi standar' },
        { label: 'Tajam (350 - 700 KB)', targetKB: 600, desc: 'Resolusi tinggi' }
      ]);
    } else if (file.type === 'application/pdf') {
      detectedType = 'pdf';
      document.getElementById('fileTypeBadge').textContent = 'Dokumen PDF Terdeteksi';
      document.getElementById('fileTypeBadge').className = 'px-2.5 py-1 text-xs font-bold uppercase rounded-full bg-amber-100 text-amber-700';
      renderSizeOptions([
        { label: 'Ringan (< 500 KB)', targetKB: 450, desc: 'Cocok untuk 1-3 halaman' },
        { label: 'Standar (500 KB - 1.2 MB)', targetKB: 1000, desc: 'Kualitas teks jelas' },
        { label: 'Detail Tinggi (1.2 - 2.5 MB)', targetKB: 2200, desc: 'Untuk dokumen banyak halaman' }
      ]);
    } else {
      alert('Format file tidak didukung! Harap pilih gambar (JPG/PNG) atau PDF.');
      compressionPanel.classList.add('hidden');
    }
  });

  // Render Pilihan Radio Rentang Ukuran
  function renderSizeOptions(options) {
    sizeOptionsContainer.innerHTML = '';
    options.forEach((opt, idx) => {
      const checked = idx === 1 ? 'checked' : '';
      sizeOptionsContainer.innerHTML += `
        <label class="border border-slate-300 rounded-lg p-3 cursor-pointer hover:border-indigo-500 flex flex-col justify-between bg-white has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50">
          <div class="flex items-center gap-2">
            <input type="radio" name="targetSize" value="${opt.targetKB}" ${checked} class="text-indigo-600 focus:ring-indigo-500">
            <span class="text-xs font-bold text-slate-800">${opt.label}</span>
          </div>
          <span class="text-[11px] text-slate-500 mt-1 pl-5">${opt.desc}</span>
        </label>
      `;
    });
  }

  // 2. MESIN KOMPRESI GAMBAR (ITERATIVE TARGET SEEKING)
  async function compressImageToTarget(file, targetKB) {
    const targetBytes = targetKB * 1024;
    if (file.size <= targetBytes) return file; // Jika sudah lebih kecil dari target, tidak perlu diperkecil paksa

    const img = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = e => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = rej;
        i.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    let scale = 1.0;
    // Jika resolusi sangat besar (> 2000px), turunkan skala awal agar proporsional
    const maxDim = Math.max(img.width, img.height);
    if (maxDim > 2000) scale = 2000 / maxDim;

    let bestBlob = null;

    // Loop penurunan skala & kualitas secara bertahap sampai masuk targetBytes
    while (scale >= 0.3) {
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      // Binary search kualitas JPEG antara 0.15 sampai 0.92
      let low = 0.15, high = 0.92;
      for (let i = 0; i < 6; i++) {
        const midQuality = (low + high) / 2;
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', midQuality));
        bestBlob = blob;

        if (blob.size > targetBytes) {
          high = midQuality; // Perkecil kualitas
        } else {
          low = midQuality;  // Naikkan kualitas agar mendekati batas atas target
        }
      }

      if (bestBlob && bestBlob.size <= targetBytes) break;
      scale -= 0.2; // Jika pada kualitas rendah masih kebesaran, turunkan dimensi piksel
    }

    return bestBlob;
  }

  // 3. MESIN KOMPRESI PDF (RENDER PAGE-BY-PAGE TANPA MENGUBAH ISI)
  async function compressPdfToTarget(file, targetKB) {
    const targetBytes = targetKB * 1024;
    if (file.size <= targetBytes) return file;

    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    progressContainer.classList.remove('hidden');

    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const totalPages = pdf.numPages;

    // Tentukan skala & kualitas berdasarkan jatah byte per halaman
    const budgetPerPageKB = targetKB / totalPages;
    let renderScale = 1.5;
    let jpegQuality = 0.75;

    if (budgetPerPageKB < 80) {
      renderScale = 1.0; jpegQuality = 0.5;
    } else if (budgetPerPageKB < 180) {
      renderScale = 1.25; jpegQuality = 0.65;
    } else {
      renderScale = 1.6; jpegQuality = 0.80;
    }

    const { jsPDF } = window.jspdf;
    let newPdf = null;

    for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
      progressText.textContent = `Memproses halaman ${pageNum} dari ${totalPages}...`;
      progressBar.style.width = `${Math.round((pageNum / totalPages) * 100)}%`;

      const page = await pdf.getPage(pageNum);
      const viewport = page.getViewport({ scale: renderScale });

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      const imgData = canvas.toDataURL('image/jpeg', jpegQuality);

      // Ukuran asli dalam satuan point (pt) agar ukuran kertas PDF tidak berubah
      const origViewport = page.getViewport({ scale: 1.0 });
      const orientation = origViewport.width > origViewport.height ? 'l' : 'p';

      if (pageNum === 1) {
        newPdf = new jsPDF({
          orientation: orientation,
          unit: 'pt',
          format: [origViewport.width, origViewport.height],
          compress: true
        });
      } else {
        newPdf.addPage([origViewport.width, origViewport.height], orientation);
      }

      newPdf.addImage(imgData, 'JPEG', 0, 0, origViewport.width, origViewport.height, undefined, 'FAST');
    }

    progressContainer.classList.add('hidden');
    return newPdf.output('blob');
  }

  // TOMBOL PROSES KOMPRESI
  btnCompress.addEventListener('click', async () => {
    if (!currentFile) return;
    const selectedRadio = document.querySelector('input[name="targetSize"]:checked');
    const targetKB = parseInt(selectedRadio.value, 10);

    btnCompress.disabled = true;
    btnCompress.textContent = 'Sedang Mengompresi...';

    try {
      if (detectedType === 'image') {
        compressedBlob = await compressImageToTarget(currentFile, targetKB);
      } else {
        compressedBlob = await compressPdfToTarget(currentFile, targetKB);
      }

      document.getElementById('compressedResultBox').classList.remove('hidden');
      document.getElementById('compressedSizeDisplay').textContent = formatBytes(compressedBlob.size);
      btnSubmit.disabled = false;
    } catch (err) {
      alert('Gagal mengompresi file: ' + err.message);
    } finally {
      btnCompress.disabled = false;
      btnCompress.textContent = 'Proses Kompresi Ulang';
    }
  });

  // 4. PENGIRIMAN KE BACKEND (GOOGLE APPS SCRIPT / SUPABASE)
  document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!compressedBlob) return alert('Silakan klik tombol Proses Kompresi terlebih dahulu.');

    const alertBox = document.getElementById('statusAlert');
    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Mengunggah ke Server...';
    alertBox.className = 'p-4 rounded-xl text-sm font-medium bg-blue-50 text-blue-700';
    alertBox.textContent = 'Sedang mengunggah dokumen ke Google Drive & mencatat link...';
    alertBox.classList.remove('hidden');

    try {
      // Ubah Blob hasil kompresi menjadi Base64 untuk dikirim ke Apps Script
      const base64Data = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(compressedBlob);
      });

      const ext = detectedType === 'image' ? '.jpg' : '.pdf';
      const cleanName = currentFile.name.replace(/\.[^/.]+$/, "") + "_compressed" + ext;

      const payload = {
        nama: document.getElementById('nama').value,
        keterangan: document.getElementById('keterangan').value,
        fileName: cleanName,
        mimeType: compressedBlob.type,
        originalSize: formatBytes(currentFile.size),
        compressedSize: formatBytes(compressedBlob.size),
        fileBase64: base64Data
      };

      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === 'success') {
        alertBox.className = 'p-4 rounded-xl text-sm font-medium bg-emerald-50 text-emerald-800 border border-emerald-200';
        alertBox.innerHTML = `✅ <b>Berhasil!</b> Dokumen tersimpan.<br>Ukuran akhir: <b>${payload.compressedSize}</b>.<br><a href="${result.fileUrl}" target="_blank" class="underline font-bold mt-1 inline-block">Buka File di Google Drive</a>`;
        document.getElementById('uploadForm').reset();
        compressionPanel.classList.add('hidden');
      } else {
        throw new Error(result.message);
      }
    } catch (error) {
      alertBox.className = 'p-4 rounded-xl text-sm font-medium bg-red-50 text-red-700';
      alertBox.textContent = '❌ Terjadi kesalahan: ' + error.message;
      btnSubmit.disabled = false;
    } finally {
      btnSubmit.textContent = 'Kirim Dokumen Terkompresi';
    }
  });
</script>
</body>
</html>
